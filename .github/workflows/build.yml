name: Build

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# ---------------------------------------------------------------------------
# Version logic
#   - On a tag like v1.2.3  → version = "1.2.3"
#   - On a branch push      → version = "0.0.0-dev.<short-sha>"
#   - On a PR               → version = "0.0.0-pr.<number>"
# ---------------------------------------------------------------------------

env:
  GO_VERSION: "1.23"
  APP_NAME: tailscale-gui
  MAINTAINER: "slimbartfarst <slimbartfarst@github.com>"
  DESCRIPTION: "Tailscale Linux system tray GUI"
  HOMEPAGE: "https://github.com/slimbartfarst/tailscale-gui"

jobs:
  # ── 1. Resolve version string ─────────────────────────────────────────────
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Tagged release — strip the "refs/tags/v" prefix
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            VERSION="0.0.0-pr.${GITHUB_EVENT_NUMBER}"
          else
            # Branch push — use short SHA (bash substring is safe with shell: bash)
            VERSION="0.0.0-dev.${GITHUB_SHA:0:8}"
          fi
          # Sanitise: replace any character that is illegal in all package formats
          # (RPM forbids hyphens and slashes; we normalise here at the source)
          VERSION="${VERSION//\//.}"   # slashes → dots
          VERSION="${VERSION//-/~}"   # hyphens → tildes (RPM pre-release convention)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version resolved: ${VERSION}"
        env:
          GITHUB_EVENT_NUMBER: ${{ github.event.number }}

  # ── 2. Run tests ──────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            pkg-config

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: |
          go test -v -count=1 \
            ./internal/account/... \
            ./internal/picker/... \
            ./internal/routes/... \
            ./internal/notify/... \
            ./internal/ssh/...

  # ── 3. Build binary (amd64) ───────────────────────────────────────────────
  build:
    name: Build (amd64)
    runs-on: ubuntu-24.04
    needs: [version, test]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            pkg-config \
            gcc

      - name: Generate placeholder icons
        run: python3 scripts/generate_icons.py

      - name: Download modules
        run: go mod download

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          go build \
            -ldflags="-s -w -X main.Version=${VERSION}" \
            -o "dist/${{ env.APP_NAME }}-linux-amd64" \
            ./cmd/${{ env.APP_NAME }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-amd64
          path: dist/${{ env.APP_NAME }}-linux-amd64
          if-no-files-found: error

  # ── 4. Build .deb package (amd64) ─────────────────────────────────────────
  package-deb:
    name: Package .deb (amd64)
    runs-on: ubuntu-24.04
    needs: [version, build]
    steps:
      - uses: actions/checkout@v7

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: binary-amd64
          path: dist/

      - name: Build .deb
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          BINARY="dist/${APP_NAME}-linux-amd64"
          chmod +x "${BINARY}"

          # deb version: tildes are valid in dpkg but hyphens are more conventional.
          # Convert the source-sanitised version back to hyphen form for .deb.
          DEB_VERSION="${VERSION//\~/-}"

          PKG_DIR="build/deb/${APP_NAME}_${DEB_VERSION}_amd64"
          mkdir -p "${PKG_DIR}/DEBIAN"
          mkdir -p "${PKG_DIR}/usr/bin"
          mkdir -p "${PKG_DIR}/usr/share/applications"
          mkdir -p "${PKG_DIR}/usr/share/icons/hicolor/256x256/apps"

          install -m 755 "${BINARY}" "${PKG_DIR}/usr/bin/${APP_NAME}"

          sed 's|Exec=.*|Exec=/usr/bin/tailscale-gui|' \
            packaging/tailscale-gui.desktop \
            > "${PKG_DIR}/usr/share/applications/${APP_NAME}.desktop"

          python3 scripts/generate_icons.py
          cp assets/icons/connected.png \
            "${PKG_DIR}/usr/share/icons/hicolor/256x256/apps/${APP_NAME}.png"

          INSTALLED_SIZE=$(du -sk "${PKG_DIR}/usr" | cut -f1)
          sed \
            -e "s/VERSION_PLACEHOLDER/${DEB_VERSION}/" \
            -e "s/ARCH_PLACEHOLDER/amd64/" \
            -e "s/SIZE_PLACEHOLDER/${INSTALLED_SIZE}/" \
            packaging/deb/control \
            > "${PKG_DIR}/DEBIAN/control"

          install -m 755 packaging/deb/postinst "${PKG_DIR}/DEBIAN/postinst"
          install -m 755 packaging/deb/postrm   "${PKG_DIR}/DEBIAN/postrm"

          dpkg-deb --build --root-owner-group "${PKG_DIR}" \
            "dist/${APP_NAME}_${DEB_VERSION}_amd64.deb"

          echo "Built: dist/${APP_NAME}_${DEB_VERSION}_amd64.deb"
          dpkg-deb --info "dist/${APP_NAME}_${DEB_VERSION}_amd64.deb"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-amd64
          path: dist/${{ env.APP_NAME }}_*_amd64.deb
          if-no-files-found: error

  # ── 5. Build .rpm package (x86_64) ────────────────────────────────────────
  package-rpm:
    name: Package .rpm (x86_64)
    runs-on: ubuntu-24.04
    needs: [version, build]
    container:
      image: fedora:40
    steps:
      - uses: actions/checkout@v7

      - name: Install RPM build tools
        run: dnf install -y rpm-build rpmdevtools python3

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: binary-amd64
          path: dist/

      - name: Build .rpm
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          BINARY="dist/${APP_NAME}-linux-amd64"
          chmod +x "${BINARY}"

          python3 scripts/generate_icons.py

          rpmdev-setuptree
          SOURCES="${HOME}/rpmbuild/SOURCES"

          cp "${BINARY}"                                       "${SOURCES}/${APP_NAME}"
          sed 's|Exec=.*|Exec=/usr/bin/tailscale-gui|' \
            packaging/tailscale-gui.desktop                   > "${SOURCES}/${APP_NAME}.desktop"
          cp assets/icons/connected.png                       "${SOURCES}/${APP_NAME}.png"

          # Version is pre-sanitised in the version job (hyphens→tildes, slashes→dots).
          # Apply the substitution again as a safety net in case of edge cases.
          RPM_VERSION="${VERSION//-/~}"
          RPM_VERSION="${RPM_VERSION//\//.}"

          rpmbuild -bb \
            --define "version ${RPM_VERSION}" \
            --define "buildarch x86_64" \
            --target x86_64 \
            packaging/rpm/${APP_NAME}.spec

          RPM_FILE=$(find "${HOME}/rpmbuild/RPMS" -name "*.rpm" | head -1)
          OUTPUT="dist/${APP_NAME}-${RPM_VERSION}-1.x86_64.rpm"
          cp "${RPM_FILE}" "${OUTPUT}"
          echo "Built: ${OUTPUT}"
          rpm -qip "${OUTPUT}"

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-x86_64
          # Use the sanitised version in the path too
          path: dist/${{ env.APP_NAME }}-*-1.x86_64.rpm
          if-no-files-found: error

  # ── 6. Build AppImage (amd64) ─────────────────────────────────────────────
  package-appimage:
    name: Package AppImage (amd64)
    runs-on: ubuntu-22.04
    needs: [version, build]
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libfuse2 \
            libayatana-appindicator3-1 \
            libgtk-3-0 \
            file \
            python3

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: binary-amd64
          path: dist/

      - name: Download appimagetool
        run: |
          wget -q \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O /tmp/appimagetool
          chmod +x /tmp/appimagetool

      - name: Build AppImage
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          BINARY="dist/${APP_NAME}-linux-amd64"
          chmod +x "${BINARY}"

          # AppImage filenames use hyphens conventionally - convert tildes back.
          APP_VERSION="${VERSION//\~/-}"

          python3 scripts/generate_icons.py

          APPDIR="build/appimage/${APP_NAME}.AppDir"
          mkdir -p "${APPDIR}/usr/bin"
          mkdir -p "${APPDIR}/usr/share/applications"
          mkdir -p "${APPDIR}/usr/share/icons/hicolor/256x256/apps"

          install -m 755 "${BINARY}"                  "${APPDIR}/usr/bin/${APP_NAME}"
          install -m 755 packaging/appimage/AppRun    "${APPDIR}/AppRun"

          cp packaging/appimage/${APP_NAME}.desktop   "${APPDIR}/${APP_NAME}.desktop"
          cp packaging/appimage/${APP_NAME}.desktop   "${APPDIR}/usr/share/applications/${APP_NAME}.desktop"

          cp assets/icons/connected.png               "${APPDIR}/${APP_NAME}.png"
          cp assets/icons/connected.png               "${APPDIR}/usr/share/icons/hicolor/256x256/apps/${APP_NAME}.png"

          OUTPUT="dist/${APP_NAME}-${APP_VERSION}-x86_64.AppImage"
          ARCH=x86_64 /tmp/appimagetool "${APPDIR}" "${OUTPUT}"

          echo "Built: ${OUTPUT}"
          ls -lh "${OUTPUT}"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: appimage-amd64
          path: dist/${{ env.APP_NAME }}-*-x86_64.AppImage
          if-no-files-found: error

  # ── 7. Create GitHub Release (tags only) ──────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-24.04
    needs: [version, package-deb, package-rpm, package-appimage]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets/
          merge-multiple: true

      - name: List release assets
        run: find release-assets/ -type f | sort

      - name: Generate release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > release-notes.md << 'NOTES'
          ## Installation

          ### Debian / Ubuntu (.deb)
          ```bash
          sudo dpkg -i tailscale-gui_VERSION_amd64.deb
          ```

          ### Fedora / RHEL / openSUSE (.rpm)
          ```bash
          sudo rpm -i tailscale-gui-VERSION-1.x86_64.rpm
          ```

          ### AppImage (any distro, amd64)
          ```bash
          chmod +x tailscale-gui-VERSION-x86_64.AppImage
          ./tailscale-gui-VERSION-x86_64.AppImage
          ```

          ## Prerequisites

          - [Tailscale](https://tailscale.com/download/linux) must be installed and `tailscaled` running
          - Run once: `sudo tailscale set --operator=$USER`
          - GNOME users: install the [AppIndicator extension](https://extensions.gnome.org/extension/615/appindicator-support/)

          ## What's included

          - System tray icon with connect/disconnect, peer list, exit node selection
          - Subnet route advertising with local interface suggestions
          - Taildrop file send/receive with D-Bus action notifications
          - SSH peer launch with terminal auto-detection
          - Multi-account support
          - Browser-based status dashboard at localhost
          NOTES
          sed -i "s/VERSION/${VERSION}/g" release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "tailscale-gui v${{ needs.version.outputs.version }}"
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          files: |
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.AppImage
          fail_on_unmatched_files: true
