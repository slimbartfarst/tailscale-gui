name: Build

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# ---------------------------------------------------------------------------
# Version logic
#   - On a tag like v1.2.3  → version = "1.2.3"
#   - On a branch push      → version = "0.0.0-dev.<short-sha>"
#   - On a PR               → version = "0.0.0-pr.<number>"
# ---------------------------------------------------------------------------

env:
  GO_VERSION: "1.23"
  APP_NAME: tailscale-gui
  MAINTAINER: "Slimbartfarst <slim_bartfarst@hotmail.co.uk>"
  DESCRIPTION: "Tailscale Linux system tray GUI"
  HOMEPAGE: "https://github.com/slimbartfarst/tailscale-gui"

jobs:
  # ── 1. Resolve version string ─────────────────────────────────────────────
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Determine version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            VERSION="0.0.0-pr.${GITHUB_EVENT_NUMBER}"
          else
            SHA="${GITHUB_SHA::8}"
            VERSION="0.0.0-dev.${SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"
        env:
          GITHUB_EVENT_NUMBER: ${{ github.event.number }}

  # ── 2. Run tests ──────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libglib2.0-dev

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test (pure-logic packages only — no display required)
        run: |
          go test -v -count=1 \
            ./internal/account/... \
            ./internal/picker/... \
            ./internal/routes/... \
            ./internal/notify/... \
            ./internal/ssh/...

  # ── 3. Build binaries ─────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: [version, test]
    strategy:
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: arm64
            goarch: arm64
            deb_arch: arm64
            rpm_arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            pkg-config

      - name: Generate placeholder icons
        run: python3 scripts/generate_icons.py

      - name: Download modules
        run: go mod download

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.goarch == 'arm64' && 'aarch64-linux-gnu-gcc' || 'gcc' }}
          CGO_CFLAGS: ${{ matrix.goarch == 'arm64' && '-I/usr/aarch64-linux-gnu/include' || '' }}
          CGO_LDFLAGS: ${{ matrix.goarch == 'arm64' && '-L/usr/aarch64-linux-gnu/lib' || '' }}
          PKG_CONFIG_PATH: ${{ matrix.goarch == 'arm64' && '/usr/lib/aarch64-linux-gnu/pkgconfig' || '' }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          go build \
            -ldflags="-s -w -X main.Version=${VERSION}" \
            -o "dist/${{ env.APP_NAME }}-linux-${{ matrix.goarch }}" \
            ./cmd/${{ env.APP_NAME }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: dist/${{ env.APP_NAME }}-linux-${{ matrix.goarch }}
          if-no-files-found: error

  # ── 4. Build .deb packages ────────────────────────────────────────────────
  package-deb:
    name: Package .deb (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: [version, build]
    strategy:
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            deb_arch: amd64
          - arch: arm64
            goarch: arm64
            deb_arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: dist/

      - name: Build .deb
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY="dist/${APP_NAME}-linux-${GOARCH}"
          chmod +x "${BINARY}"

          # Build directory tree matching installed layout
          PKG_DIR="build/deb/${APP_NAME}_${VERSION}_${DEB_ARCH}"
          mkdir -p "${PKG_DIR}/DEBIAN"
          mkdir -p "${PKG_DIR}/usr/bin"
          mkdir -p "${PKG_DIR}/usr/share/applications"
          mkdir -p "${PKG_DIR}/usr/share/icons/hicolor/256x256/apps"

          # Binary
          install -m 755 "${BINARY}" "${PKG_DIR}/usr/bin/${APP_NAME}"

          # Desktop entry (system-wide install — no %h substitution needed)
          sed 's|Exec=.*|Exec=/usr/bin/tailscale-gui|' \
            packaging/tailscale-gui.desktop \
            > "${PKG_DIR}/usr/share/applications/${APP_NAME}.desktop"

          # Icon — generate a simple one if no real icon exists
          if [ -f "assets/icons/connected.png" ]; then
            cp assets/icons/connected.png \
              "${PKG_DIR}/usr/share/icons/hicolor/256x256/apps/${APP_NAME}.png"
          else
            python3 scripts/generate_icons.py
            cp assets/icons/connected.png \
              "${PKG_DIR}/usr/share/icons/hicolor/256x256/apps/${APP_NAME}.png"
          fi

          # DEBIAN/control
          INSTALLED_SIZE=$(du -sk "${PKG_DIR}/usr" | cut -f1)
          sed \
            -e "s/VERSION_PLACEHOLDER/${VERSION}/" \
            -e "s/ARCH_PLACEHOLDER/${DEB_ARCH}/" \
            -e "s/SIZE_PLACEHOLDER/${INSTALLED_SIZE}/" \
            packaging/deb/control \
            > "${PKG_DIR}/DEBIAN/control"

          # Maintainer scripts
          install -m 755 packaging/deb/postinst "${PKG_DIR}/DEBIAN/postinst"
          install -m 755 packaging/deb/postrm   "${PKG_DIR}/DEBIAN/postrm"

          # Build the package
          dpkg-deb --build --root-owner-group "${PKG_DIR}" \
            "dist/${APP_NAME}_${VERSION}_${DEB_ARCH}.deb"

          echo "Built: dist/${APP_NAME}_${VERSION}_${DEB_ARCH}.deb"
          dpkg-deb --info "dist/${APP_NAME}_${VERSION}_${DEB_ARCH}.deb"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.deb_arch }}
          path: dist/${{ env.APP_NAME }}_${{ needs.version.outputs.version }}_${{ matrix.deb_arch }}.deb
          if-no-files-found: error

  # ── 5. Build .rpm packages ────────────────────────────────────────────────
  package-rpm:
    name: Package .rpm (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: [version, build]
    container:
      image: fedora:40
    strategy:
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            rpm_arch: x86_64
          - arch: arm64
            goarch: arm64
            rpm_arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install RPM build tools
        run: dnf install -y rpm-build rpmdevtools python3

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: dist/

      - name: Build .rpm
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY="dist/${APP_NAME}-linux-${GOARCH}"
          chmod +x "${BINARY}"

          # Generate icon if needed
          python3 scripts/generate_icons.py

          # Set up rpmbuild tree
          rpmdev-setuptree
          SOURCES="${HOME}/rpmbuild/SOURCES"

          # Stage source files the spec expects
          cp "${BINARY}"                                                   "${SOURCES}/${APP_NAME}"
          sed 's|Exec=.*|Exec=/usr/bin/tailscale-gui|' \
            packaging/tailscale-gui.desktop                               > "${SOURCES}/${APP_NAME}.desktop"
          cp assets/icons/connected.png                                   "${SOURCES}/${APP_NAME}.png"

          # Build the RPM — set version and buildarch via defines
          rpmbuild -bb \
            --define "version ${VERSION}" \
            --define "buildarch ${RPM_ARCH}" \
            --target "${RPM_ARCH}" \
            packaging/rpm/${APP_NAME}.spec

          # Find and copy the output RPM
          RPM_FILE=$(find "${HOME}/rpmbuild/RPMS" -name "*.rpm" | head -1)
          OUTPUT="dist/${APP_NAME}-${VERSION}-1.${RPM_ARCH}.rpm"
          cp "${RPM_FILE}" "${OUTPUT}"
          echo "Built: ${OUTPUT}"
          rpm -qip "${OUTPUT}"

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.rpm_arch }}
          path: dist/${{ env.APP_NAME }}-${{ needs.version.outputs.version }}-1.${{ matrix.rpm_arch }}.rpm
          if-no-files-found: error

  # ── 6. Build AppImage (amd64 only) ────────────────────────────────────────
  package-appimage:
    name: Package AppImage (amd64)
    runs-on: ubuntu-22.04    # older base for maximum glibc compat
    needs: [version, build]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libfuse2 \
            libayatana-appindicator3-1 \
            libgtk-3-0 \
            file \
            python3

      - name: Download binary (amd64)
        uses: actions/download-artifact@v4
        with:
          name: binary-amd64
          path: dist/

      - name: Download appimagetool
        run: |
          wget -q \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O /tmp/appimagetool
          chmod +x /tmp/appimagetool

      - name: Build AppImage
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          BINARY="dist/${APP_NAME}-linux-amd64"
          chmod +x "${BINARY}"

          python3 scripts/generate_icons.py

          # Build the AppDir structure
          APPDIR="build/appimage/${APP_NAME}.AppDir"
          mkdir -p "${APPDIR}/usr/bin"
          mkdir -p "${APPDIR}/usr/share/applications"
          mkdir -p "${APPDIR}/usr/share/icons/hicolor/256x256/apps"

          # Binary
          install -m 755 "${BINARY}" "${APPDIR}/usr/bin/${APP_NAME}"

          # AppRun entry point
          install -m 755 packaging/appimage/AppRun "${APPDIR}/AppRun"

          # Desktop entry (at AppDir root — required by AppImage spec)
          cp packaging/appimage/${APP_NAME}.desktop "${APPDIR}/${APP_NAME}.desktop"
          cp packaging/appimage/${APP_NAME}.desktop \
            "${APPDIR}/usr/share/applications/${APP_NAME}.desktop"

          # Icon (at AppDir root and in hicolor tree — both required)
          cp assets/icons/connected.png "${APPDIR}/${APP_NAME}.png"
          cp assets/icons/connected.png \
            "${APPDIR}/usr/share/icons/hicolor/256x256/apps/${APP_NAME}.png"

          # Build the AppImage
          OUTPUT="dist/${APP_NAME}-${VERSION}-x86_64.AppImage"
          ARCH=x86_64 /tmp/appimagetool "${APPDIR}" "${OUTPUT}"

          echo "Built: ${OUTPUT}"
          ls -lh "${OUTPUT}"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-amd64
          path: dist/${{ env.APP_NAME }}-${{ needs.version.outputs.version }}-x86_64.AppImage
          if-no-files-found: error

  # ── 7. Create GitHub Release (tags only) ─────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-24.04
    needs: [version, package-deb, package-rpm, package-appimage]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: List release assets
        run: find release-assets/ -type f | sort

      - name: Generate release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > release-notes.md << 'EOF'
          ## Installation

          ### Debian / Ubuntu (.deb)
          ```bash
          # amd64
          sudo dpkg -i tailscale-gui_${VERSION}_amd64.deb
          # arm64
          sudo dpkg -i tailscale-gui_${VERSION}_arm64.deb
          ```

          ### Fedora / RHEL / openSUSE (.rpm)
          ```bash
          # x86_64
          sudo rpm -i tailscale-gui-${VERSION}-1.x86_64.rpm
          # aarch64
          sudo rpm -i tailscale-gui-${VERSION}-1.aarch64.rpm
          ```

          ### AppImage (any distro, amd64)
          ```bash
          chmod +x tailscale-gui-${VERSION}-x86_64.AppImage
          ./tailscale-gui-${VERSION}-x86_64.AppImage
          ```

          ## Prerequisites

          - [Tailscale](https://tailscale.com/download/linux) must be installed and `tailscaled` running
          - Run once: `sudo tailscale set --operator=$USER`
          - GNOME users: install the [AppIndicator extension](https://extensions.gnome.org/extension/615/appindicator-support/)

          ## What's included

          - System tray icon with connect/disconnect, peer list, exit node selection
          - Subnet route advertising with local interface suggestions
          - Taildrop file send/receive with D-Bus action notifications
          - SSH peer launch with terminal auto-detection
          - Multi-account support
          - Browser-based status dashboard at localhost
          EOF
          # Substitute the version into the notes
          sed -i "s/\${VERSION}/${VERSION}/g" release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "tailscale-gui v${{ needs.version.outputs.version }}"
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          files: |
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.AppImage
          fail_on_unmatched_files: true
